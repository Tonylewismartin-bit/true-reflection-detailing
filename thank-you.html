<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | True Reflection Detailing</title>
  <meta name="robots" content="noindex, follow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
    }

    .thank-you {
      max-width: 700px;
    }

    .logo {
      max-width: 320px;
      width: 80%;
      height: auto;
      margin-bottom: 35px;
    }

    h1 {
      font-size: 38px;
      margin: 0 0 20px;
      letter-spacing: 1px;
    }

    .gold-line {
      width: 70px;
      height: 3px;
      background: #c6ad78;
      margin: 0 auto 25px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      color: #d7d7d7;
      margin-bottom: 35px;
    }

    .home-button {
      display: inline-block;
      background: #c6ad78;
      color: #000000;
      text-decoration: none;
      padding: 15px 30px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: 0.2s ease;
    }

    .home-button:hover {
      background: #ffffff;
    }
  </style>
</head>

<body>

  <main class="thank-you">

    <img
      src="logo_transparent.png"
      alt="True Reflection Detailing"
      class="logo"
    >

    <h1>Thank You for Your Enquiry</h1>

    <div class="gold-line"></div>

    <p>
      We've received your booking request and vehicle photos.
      We'll review the details and get back to you with availability
      and any information we need before confirming your appointment.
    </p>

    <a href="index.html" class="home-button">
      Return to True Reflection Detailing
    </a>

  </main>

</body>
</html>
